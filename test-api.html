<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { padding: 10px; margin: 5px; cursor: pointer; }
    #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 200px; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>API Test</h1>
  
  <div>
    <button onclick="testApi('/api/patients/dietitians-api')">Test Dietitians API</button>
    <button onclick="testApi('/api/patients/mypatients-test')">Test My Patients</button>
    <button onclick="testApi('/api/patients/direct-dietitians')">Test Direct Dietitians</button>
    <button onclick="testApi('http://localhost:5000/api/patients/dietitians-api')">Test Full URL</button>
  </div>
  
  <div id="result">Results will appear here...</div>

  <script>
    async function testApi(url) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `<p>Testing ${url}...</p>`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <h3>Success! (Status: ${response.status})</h3>
          <p>URL: ${url}</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <h3>Error!</h3>
          <p>URL: ${url}</p>
          <p>Error: ${error.message}</p>
        `;
      }
    }
  </script>
</body>
</html>
